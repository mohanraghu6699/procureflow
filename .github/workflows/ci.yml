name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procureflow
          POSTGRES_PASSWORD: procureflow
          POSTGRES_DB: procureflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procureflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://procureflow:procureflow@localhost:5432/procureflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run migrations against an empty database
        env:
          DATABASE_URL: postgresql+psycopg2://procureflow:procureflow@localhost:5432/procureflow_test
          JWT_SECRET_KEY: ci-only-secret
        run: alembic upgrade head && alembic downgrade base
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the API (migrations and seeding run first)
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Log in with a seeded account
        run: |
          curl -sf -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@procureflow.com","password":"Admin@123"}' | grep -q access_token
      - name: Frontend is served
        run: curl -sf http://localhost:5173/ | grep -q 'id="root"'
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
