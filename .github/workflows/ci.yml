name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procureflow
          POSTGRES_PASSWORD: procureflow
          POSTGRES_DB: procureflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procureflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://procureflow:procureflow@localhost:5432/procureflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run migrations against an empty database
        env:
          # The app has no built-in defaults, so every setting is given here (throwaway CI values).
          DATABASE_URL: postgresql+psycopg2://procureflow:procureflow@localhost:5432/procureflow_test
          JWT_SECRET_KEY: ci-only-secret
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          LOG_LEVEL: INFO
          CORS_ORIGINS: http://localhost:5173
        run: alembic upgrade head && alembic downgrade base
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # No fallback in the code: the build stops without it.
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml takes every value from the environment; these are throwaway values for this CI run only.
      POSTGRES_USER: procureflow_ci
      POSTGRES_PASSWORD: ci-db-password
      POSTGRES_DB: procureflow
      JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:8000
      DB_HOST_PORT: "5432"
      BACKEND_HOST_PORT: "8000"
      FRONTEND_HOST_PORT: "5173"
      SEED_ADMIN_PASSWORD: ci-smoke-test-pw
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the API (migrations and seeding run first)
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy in time"
          exit 1
      - name: Log in with the seeded admin (password came from SEED_ADMIN_PASSWORD)
        run: |
          curl -sf -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@procureflow.com\",\"password\":\"${SEED_ADMIN_PASSWORD}\"}" | grep -q access_token
      - name: The old well-known default password no longer works
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@procureflow.com","password":"Admin@123"}')"
          test "$code" = "401"
      - name: Frontend is served
        run: curl -sf http://localhost:5173/ | grep -q 'id="root"'
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
